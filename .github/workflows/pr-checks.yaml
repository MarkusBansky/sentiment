name: PR Checks

on:
  pull_request:
    branches:
      - "**"

jobs:
  cve-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: CVE audit
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
